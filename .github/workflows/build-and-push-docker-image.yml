name: Build and Push Docker Images

on:
    push:
        branches:
            - main
        paths:
            - "patch/**"
            - "Dockerfile"
            - ".github/workflows/build-and-push-docker-image.yml"
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 登录到 GHCR
            - name: Log in to GitHub Container Registry (GHCR)
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 登录到阿里云 ACR
            - name: Log in to ACR
              uses: docker/login-action@v3
              with:
                  registry: ${{ secrets.ALIYUN_REGISTRY }}
                  username: ${{ secrets.ALIYUN_REGISTRY_USER }}
                  password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

            # 获取当前日期 (yyyy-MM-dd) 并强制用户名小写
            - name: Prepare Image Tags
              id: prep
              run: |
                  OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  DATE=$(date +'%Y-%m-%d')
                  echo "owner=$OWNER" >> $GITHUB_OUTPUT
                  echo "date=$DATE" >> $GITHUB_OUTPUT

            # ---------------------------------------------------
            # 0. 构建 Base 阶段
            # ---------------------------------------------------
            - name: Build and push Base image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  target: base
                  provenance: false
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike:${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike:latest
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike:${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike:latest

                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # ---------------------------------------------------
            # 1. 构建 1.6 DM 模式
            # ---------------------------------------------------
            - name: Build and push CS-DM image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  target: cs-dm
                  provenance: false
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike:1.6-dm-${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike:1.6-dm-latest
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike:1.6-dm-${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike:1.6-dm-latest
                  cache-from: type=gha

            # ---------------------------------------------------
            # 2. 构建 1.6 Versus 模式
            # ---------------------------------------------------
            - name: Build and push CS-Versus image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  target: cs-versus
                  provenance: false
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike:1.6-versus-${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike:1.6-versus-latest
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike:1.6-versus-${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike:1.6-versus-latest
                  cache-from: type=gha

            # ---------------------------------------------------
            # 3. 构建 CZ DM 模式
            # ---------------------------------------------------
            - name: Build and push CZ-DM image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  target: cscz-dm
                  provenance: false
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike:condition-zero-dm-${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike:condition-zero-dm-latest
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike:condition-zero-dm-${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike:condition-zero-dm-latest
                  cache-from: type=gha

            # ---------------------------------------------------
            # 4. 构建 CZ Versus 模式
            # ---------------------------------------------------
            - name: Build and push CZ-Versus image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  target: cscz-versus
                  provenance: false
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike:condition-zero-versus-${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike:condition-zero-versus-latest
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike:condition-zero-versus-${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike:condition-zero-versus-latest
                  cache-from: type=gha